[project]
name = "universe25-abm"
version = "0.1.0"
description = "Transparent agent-based model for 'When Resources Are Abundant but Roles Are Scarce: A Factorial Experiment in Artificial Societies'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.90",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe25"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
universe25 = "universe25.cli:main"
